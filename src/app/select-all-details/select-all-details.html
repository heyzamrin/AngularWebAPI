<div class="registration-page">
  <div class="registration-card">
    <div class="title-section">
      <div class="icon">🎓</div>
      <h1>All Student Details</h1>
      <p>View all registered student details</p>
    </div>

    <button class="insert-button" routerLink="/ins">+ Insert Details</button>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Mark</th>
            <th>Delete</th>
            <th>Details</th>
          </tr>
        </thead>
        <tbody>
          @for (p of Getdata; track p.Id) {
            <tr>
              <td>{{ p.Name }}</td>
              <td>{{ p.Age }}</td>
              <td>{{ p.Mark }}</td>
              <td>{{ p.Id }}</td>
            </tr>
          }
        </tbody>
        <h2 style="color: red">Records: {{ Getdata.length }}</h2>
      </table>
    </div>
  </div>
</div>
